version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: blueprint-vet
    main: ./cmd/blueprint-vet
    binary: blueprint-vet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: blueprint-sql-check
    main: ./cmd/blueprint-sql-check
    binary: blueprint-sql-check
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: blueprint-vet
    ids: [blueprint-vet]
    formats: [tar.gz]
    name_template: >-
      blueprint-vet_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: blueprint-sql-check
    ids: [blueprint-sql-check]
    formats: [tar.gz]
    name_template: >-
      blueprint-sql-check_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: nhalm
    name: blueprint-vet
  draft: false
  prerelease: auto
